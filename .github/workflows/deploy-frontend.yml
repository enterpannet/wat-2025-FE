name: Deploy Frontend to Ubuntu

on:
  push:
    branches:
      - main
    
    
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build Frontend
      run: |
        bun run build
        echo "Frontend built successfully"

    - name: Upload built files to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        source: "dist/**"
        target: "/tmp/frontend-deploy"
        timeout: 300s

    - name: Deploy to production
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        timeout: 300s
        script: |
          set -e
          set -x
          
          echo "=== Starting Frontend Deployment ==="
          
          # Create backup
          echo "Step 1: Creating backup..."
          if [ -d "/var/www/registration-system/frontend/dist" ]; then
            sudo mv /var/www/registration-system/frontend/dist \
              /var/www/registration-system/frontend/dist.backup.$(date +%Y%m%d_%H%M%S) || true
            echo "✅ Backup created"
          else
            echo "ℹ️  No existing dist directory to backup"
          fi
          
          # Deploy new files
          echo "Step 2: Preparing deployment directory..."
          sudo mkdir -p /var/www/registration-system/frontend/dist
          sudo rm -rf /var/www/registration-system/frontend/dist/*
          echo "✅ Directory prepared"
          
          # Check and copy files
          echo "Step 3: Checking uploaded files..."
          ls -la /tmp/frontend-deploy/ || echo "⚠️  /tmp/frontend-deploy/ not found or empty"
          
          echo "Step 4: Copying files..."
          if [ -d "/tmp/frontend-deploy/dist" ]; then
            echo "📁 Found nested dist directory, copying from dist subdirectory..."
            sudo cp -r /tmp/frontend-deploy/dist/* /var/www/registration-system/frontend/dist/ || true
          else
            echo "📁 Files directly in deploy directory, copying..."
            sudo cp -r /tmp/frontend-deploy/* /var/www/registration-system/frontend/dist/ || true
          fi
          echo "✅ Files copied"
          
          # Verify files
          echo "Step 5: Verifying deployment..."
          ls -la /var/www/registration-system/frontend/dist/ || echo "⚠️  No files in dist directory"
          if [ -f "/var/www/registration-system/frontend/dist/index.html" ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html NOT found!"
            exit 1
          fi
          
          # Set permissions
          echo "Step 6: Setting permissions..."
          sudo chown -R www-data:www-data /var/www/registration-system/frontend/dist
          sudo chmod -R 755 /var/www/registration-system/frontend/dist
          echo "✅ Permissions set"
          
          # Reload Nginx
          echo "Step 7: Reloading Nginx..."
          sudo nginx -t || (echo "❌ Nginx config test failed!" && exit 1)
          sudo systemctl daemon-reload || true
          sudo systemctl reload nginx || sudo systemctl restart nginx
          echo "✅ Nginx reloaded"
          
          # Cleanup
          echo "Step 8: Cleaning up..."
          sudo rm -rf /tmp/frontend-deploy || true
          echo "✅ Cleanup completed"
          
          echo "=== Frontend Deployment Completed Successfully! ==="

    - name: Deployment status
      if: always()
      run: |
        echo "Deployment finished with status: ${{ job.status }}"

